name: Diagnose sshd config (one-off)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Set up SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect sshd_config and drop-ins
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'EOF'
          echo "--- /etc/ssh/sshd_config (grep Include/PasswordAuthentication) ---"
          grep -n -i "include\|passwordauthentication" /etc/ssh/sshd_config
          echo "--- /etc/ssh/sshd_config.d/ ---"
          ls -la /etc/ssh/sshd_config.d/ 2>/dev/null || echo "no such directory"
          for f in /etc/ssh/sshd_config.d/*.conf; do
            echo "== $f =="
            cat "$f" 2>/dev/null
          done
          echo "--- sshd -T full effective PasswordAuthentication + matching blocks ---"
          sudo sshd -T | grep -i passwordauthentication
          echo "--- which sshd binary / version ---"
          sudo sshd -V 2>&1 || true
          EOF
