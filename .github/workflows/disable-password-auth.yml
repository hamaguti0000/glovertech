name: Disable SSH password authentication (one-off)

on:
  workflow_dispatch:

jobs:
  disable-password-auth:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Set up SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Disable PasswordAuthentication (connects via key only; aborts if sshd -t fails)
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'EOF'
          set -e
          sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak-$(date +%Y%m%d%H%M%S)
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
          grep -q '^PasswordAuthentication no' /etc/ssh/sshd_config
          echo "--- sshd -t (syntax check) ---"
          sudo sshd -t
          echo "--- reloading sshd ---"
          sudo systemctl reload sshd
          echo "--- current PasswordAuthentication setting ---"
          sudo sshd -T | grep -i passwordauthentication
          EOF

      - name: Re-verify key-based access still works after reload
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "echo POST_LOCKDOWN_KEY_AUTH_OK"
