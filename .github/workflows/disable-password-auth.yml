name: Disable SSH password authentication (one-off)

on:
  workflow_dispatch:

jobs:
  disable-password-auth:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Set up SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Disable PasswordAuthentication in sshd_config.d and main config
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'EOF'
          set -e
          TS=$(date +%Y%m%d%H%M%S)

          # sshd_config.d/50-cloud-init.conf sets "PasswordAuthentication yes" and,
          # because the main config's Include line comes before its own
          # PasswordAuthentication line, this drop-in wins under sshd's
          # first-obtained-value-wins rule. Fix it at the source instead of
          # relying on drop-in load order.
          if [ -f /etc/ssh/sshd_config.d/50-cloud-init.conf ]; then
            sudo cp /etc/ssh/sshd_config.d/50-cloud-init.conf /etc/ssh/sshd_config.d/50-cloud-init.conf.bak-$TS
            sudo sed -i 's/^PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config.d/50-cloud-init.conf
          fi

          sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak-$TS
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config

          echo "--- sshd -t (syntax check) ---"
          sudo sshd -t

          echo "--- effective PasswordAuthentication BEFORE reload (parsed from files on disk) ---"
          EFFECTIVE=$(sudo sshd -T | grep -i '^passwordauthentication ' | awk '{print $2}')
          echo "$EFFECTIVE"
          if [ "$EFFECTIVE" != "no" ]; then
            echo "ABORT: effective PasswordAuthentication is still '$EFFECTIVE', not reloading sshd." >&2
            exit 1
          fi

          echo "--- reloading sshd ---"
          sudo systemctl reload sshd

          echo "--- effective PasswordAuthentication AFTER reload ---"
          EFFECTIVE_AFTER=$(sudo sshd -T | grep -i '^passwordauthentication ' | awk '{print $2}')
          echo "$EFFECTIVE_AFTER"
          if [ "$EFFECTIVE_AFTER" != "no" ]; then
            echo "WARNING: post-reload value is '$EFFECTIVE_AFTER', expected 'no'." >&2
            exit 1
          fi
          EOF

      - name: Re-verify key-based access still works after reload
        run: |
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "echo POST_LOCKDOWN_KEY_AUTH_OK"
