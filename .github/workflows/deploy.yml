name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run generate

      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Prepare remote directory
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ${{ secrets.VPS_APP_DIR }}"

      - name: Upload static files
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT }}" \
            .output/public/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/"

      - name: Render nginx config
        run: |
          sed "s#__VPS_APP_DIR__#${{ secrets.VPS_APP_DIR }}#" deploy/nginx.conf.template > nagasaki-ai.nginx.conf

      - name: Upload nginx config
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp -o StrictHostKeyChecking=no -P "${{ secrets.VPS_PORT }}" \
            nagasaki-ai.nginx.conf "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/etc/nginx/sites-available/nagasaki-ai"

      - name: Enable site and reload nginx
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "command -v nginx >/dev/null || (apt-get update -y && apt-get install -y nginx); ln -sf /etc/nginx/sites-available/nagasaki-ai /etc/nginx/sites-enabled/nagasaki-ai && nginx -t && systemctl reload nginx"
