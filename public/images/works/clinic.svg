<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="clinicTitle">
  <title id="clinicTitle">接骨院のホームページのイメージイラスト</title>
  <rect width="800" height="600" fill="#F5F2EA" />

  <!-- 建物（院）のイメージ -->
  <g transform="translate(400,260)">
    <path d="M-240,20 L0,-140 L240,20 Z" fill="#14213D" />
    <rect x="-190" y="20" width="380" height="220" fill="#FFFFFF" stroke="#14213D" stroke-width="4" />
    <rect x="-40" y="120" width="80" height="120" fill="#14213D" opacity="0.9" />
    <rect x="-150" y="60" width="60" height="60" fill="#805A15" opacity="0.25" />
    <rect x="90" y="60" width="60" height="60" fill="#805A15" opacity="0.25" />
  </g>

  <!-- 医療（十字）マーク -->
  <g transform="translate(400,150)">
    <circle r="52" fill="#805A15" />
    <rect x="-10" y="-30" width="20" height="60" fill="#FFFFFF" />
    <rect x="-30" y="-10" width="60" height="20" fill="#FFFFFF" />
  </g>
</svg>
