<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="weddingTitle">
  <title id="weddingTitle">結婚式の招待・出欠管理サイトのイメージイラスト</title>
  <rect width="800" height="600" fill="#F5F2EA" />

  <!-- 招待状（封筒）のイメージ -->
  <g transform="translate(400,340)">
    <rect x="-220" y="-130" width="440" height="290" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="4" />
    <path d="M-220,-130 L0,40 L220,-130" fill="none" stroke="#14213D" stroke-width="4" stroke-linejoin="round" />
    <line x1="-150" y1="90" x2="150" y2="90" stroke="#14213D" stroke-width="4" stroke-linecap="round" opacity="0.35" />
    <line x1="-110" y1="120" x2="110" y2="120" stroke="#14213D" stroke-width="4" stroke-linecap="round" opacity="0.25" />
  </g>

  <!-- 結婚指輪のイメージ -->
  <g transform="translate(400,180)">
    <circle cx="-34" cy="0" r="46" fill="none" stroke="#805A15" stroke-width="12" />
    <circle cx="34" cy="0" r="46" fill="none" stroke="#805A15" stroke-width="12" />
    <path d="M-34,-46 L-24,-70 L-44,-70 Z" fill="#805A15" />
  </g>
</svg>
