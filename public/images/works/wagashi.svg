<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="wagashiTitle">
  <title id="wagashiTitle">和洋菓子店のホームページのイメージイラスト</title>
  <rect width="800" height="600" fill="#F5F2EA" />

  <!-- 店の暖簾（のれん）のイメージ -->
  <g transform="translate(400,90)">
    <rect x="-220" y="0" width="440" height="70" fill="#14213D" />
    <rect x="-220" y="70" width="60" height="90" fill="#14213D" />
    <rect x="-90" y="70" width="60" height="90" fill="#14213D" />
    <rect x="30" y="70" width="60" height="90" fill="#14213D" />
    <rect x="160" y="70" width="60" height="90" fill="#14213D" />
    <circle cx="0" cy="35" r="20" fill="#F5F2EA" />
  </g>

  <!-- 和菓子（練り切り）のイメージ -->
  <g transform="translate(300,400)">
    <ellipse cx="0" cy="60" rx="120" ry="26" fill="#14213D" opacity="0.08" />
    <path d="M-90,20 C-90,-40 -40,-90 0,-90 C40,-90 90,-40 90,20 C90,55 40,70 0,70 C-40,70 -90,55 -90,20 Z" fill="#FFFFFF" stroke="#805A15" stroke-width="4" />
    <path d="M-70,10 Q0,-60 70,10" fill="none" stroke="#805A15" stroke-width="4" opacity="0.55" />
    <circle cx="0" cy="10" r="14" fill="#805A15" />
  </g>

  <!-- 焼き菓子（マドレーヌ風）のイメージ -->
  <g transform="translate(520,420)">
    <ellipse cx="0" cy="40" rx="90" ry="60" fill="#805A15" />
    <path d="M-70,10 Q0,-40 70,10" fill="none" stroke="#F5F2EA" stroke-width="6" opacity="0.6" />
    <path d="M-55,35 Q0,-5 55,35" fill="none" stroke="#F5F2EA" stroke-width="6" opacity="0.6" />
  </g>
</svg>
